<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>買い物リスト（バーコード購入登録・在庫連携対応）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  </head>
  <body class="bg-gray-100 flex justify-center items-center min-h-screen font-sans">
    <!-- スマホフレームの外枠 -->
    <div class="w-full max-w-md bg-slate-50 min-h-screen sm:min-h-[844px] sm:rounded-3xl sm:shadow-2xl flex flex-col overflow-hidden relative border-x sm:border border-gray-300">
      <!-- ヘッダー -->
      <header class="bg-emerald-600 text-white px-4 py-4 flex items-center justify-between shadow-md z-10">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-basket-shopping text-xl"></i>
          <h1 class="font-bold text-base tracking-wider">買い物リスト</h1>
        </div>
        <button onclick="openAddToListModal()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs px-3 py-1.5 rounded-full font-bold flex items-center gap-1 transition-all"><i class="fa-solid fa-plus"></i> 追加</button>
      </header>

      <!-- 現在のお店選択バー -->
      <div class="bg-white px-4 py-2.5 border-b border-gray-200 shadow-sm flex items-center gap-2">
        <i class="fa-solid fa-store text-emerald-600 text-sm shrink-0"></i>
        <span class="text-xs font-bold text-gray-600 shrink-0">今のお店:</span>
        <select id="currentShopSelect" onchange="onShopSelectChange()" class="flex-1 bg-gray-50 border border-gray-300 text-gray-800 text-xs rounded-lg px-2 py-1.5 focus:ring-emerald-500 focus:border-emerald-500"></select>
        <input type="text" id="currentShopOther" placeholder="お店の名前" oninput="saveCurrentShopOther()" class="hidden flex-1 bg-gray-50 border border-gray-300 text-gray-800 text-xs rounded-lg px-2 py-1.5 focus:ring-emerald-500 focus:border-emerald-500" />
      </div>

      <!-- スクロール可能なメインコンテンツ -->
      <main class="flex-1 overflow-y-auto p-4 space-y-3 pb-24">
        <div class="flex items-center justify-between px-1 mb-1">
          <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">買うもの</h2>
          <span class="text-[11px] text-gray-400">スキャンして購入登録できます</span>
        </div>

        <div id="listContainer" class="space-y-3">
          <div class="text-center py-10 text-gray-400 text-sm">読み込み中...</div>
        </div>
      </main>

      <!-- ボトムナビゲーションバー（5つのタブ：買い物がアクティブ） -->
      <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-2 py-2 flex justify-around items-center text-gray-400 z-20 shadow-lg">
        <button class="flex flex-col items-center text-emerald-600 focus:outline-none font-bold">
          <i class="fa-solid fa-basket-shopping text-base"></i>
          <span class="text-[10px] mt-1">買い物</span>
        </button>
        <button onclick="location.href='stock.html'" class="flex flex-col items-center hover:text-emerald-600 focus:outline-none">
          <i class="fa-solid fa-boxes-stacked text-base"></i>
          <span class="text-[10px] mt-1">在庫</span>
        </button>
        <!-- バーコード（中央・強調）：スキャンして購入登録 -->
        <button onclick="openScanModal()" class="flex flex-col items-center hover:text-emerald-600 focus:outline-none -mt-4">
          <div class="bg-emerald-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-md border-4 border-slate-50 hover:bg-emerald-700 transition-all">
            <i class="fa-solid fa-barcode text-lg"></i>
          </div>
          <span class="text-[10px] mt-0.5 font-bold text-gray-600">スキャン</span>
        </button>
        <button onclick="location.href='menu.html'" class="flex flex-col items-center hover:text-emerald-600 focus:outline-none">
          <i class="fa-solid fa-calendar-days text-base"></i>
          <span class="text-[10px] mt-1">献立</span>
        </button>
        <button onclick="location.href='recipes.html'" class="flex flex-col items-center hover:text-emerald-600 focus:outline-none">
          <i class="fa-solid fa-utensils text-base"></i>
          <span class="text-[10px] mt-1">レシピ</span>
        </button>
      </nav>
    </div>

    <!-- リストに追加モーダル -->
    <div id="add-list-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-3 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="font-bold text-base text-gray-800">買い物リストに追加</h3>
          <button onclick="closeAddToListModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <form onsubmit="submitAddToList(event)" class="space-y-3">
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">食材名</label>
            <input type="text" id="listItemName" list="ingredientNameList" required
              class="w-full text-sm border border-gray-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="例：キャベツ" />
            <datalist id="ingredientNameList"></datalist>
          </div>
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">カテゴリ（新規食材の場合）</label>
            <select id="listItemCategory" class="w-full text-sm border border-gray-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="">選択してください</option>
              <option value="肉類">肉類</option>
              <option value="魚介類">魚介類</option>
              <option value="野菜">野菜</option>
              <option value="乳製品">乳製品</option>
              <option value="卵">卵</option>
              <option value="調味料">調味料</option>
              <option value="加工食品">加工食品</option>
              <option value="穀類">穀類</option>
              <option value="麺">麺</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm py-2.5 rounded-xl shadow transition-all">リストに追加する</button>
        </form>
      </div>
    </div>

    <!-- 購入登録モーダル（スキャン後／リストの「購入登録」ボタンから開く） -->
    <div id="purchase-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-3 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="font-bold text-base text-gray-800">購入を記録する</h3>
          <button onclick="closePurchaseModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>

        <div id="purchaseModalHint" class="text-[11px] text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 hidden"></div>

        <form onsubmit="submitPurchase(event)" class="space-y-3">
          <input type="hidden" id="purchaseResolvedId" value="" />
          <input type="hidden" id="purchaseBarcode" value="" />

          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">食材名</label>
            <input type="text" id="purchaseItemName" list="ingredientNameList" required
              class="w-full text-sm border border-gray-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          </div>

          <div id="purchaseCategoryWrap">
            <label class="text-xs font-bold text-gray-600 block mb-1">カテゴリ（新規食材の場合）</label>
            <select id="purchaseItemCategory" class="w-full text-sm border border-gray-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="">選択してください</option>
              <option value="肉類">肉類</option>
              <option value="魚介類">魚介類</option>
              <option value="野菜">野菜</option>
              <option value="乳製品">乳製品</option>
              <option value="卵">卵</option>
              <option value="調味料">調味料</option>
              <option value="加工食品">加工食品</option>
              <option value="穀類">穀類</option>
              <option value="麺">麺</option>
              <option value="その他">その他</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-bold text-gray-600 block mb-1">購入数量</label>
              <input type="number" id="purchaseQuantity" step="0.1" min="0.1" value="1" required
                class="w-full text-sm border border-gray-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            </div>
            <div>
              <label class="text-xs font-bold text-gray-600 block mb-1">単位</label>
              <select id="purchaseUnit" class="w-full text-sm border border-gray-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <option value="g">g</option>
                <option value="kg">kg</option>
                <option value="ml">ml</option>
                <option value="l">l</option>
                <option value="個">個</option>
                <option value="本">本</option>
                <option value="枚">枚</option>
                <option value="丁">丁</option>
                <option value="束">束</option>
                <option value="パック">パック</option>
                <option value="袋">袋</option>
                <option value="切れ">切れ</option>
                <option value="片">片</option>
                <option value="かけ">かけ</option>
                <option value="缶">缶</option>
                <option value="玉">玉</option>
              </select>
            </div>
          </div>

          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">金額（税抜き・合計）</label>
            <input type="number" id="purchasePrice" min="0" required
              class="w-full text-sm border border-gray-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="円" />
          </div>

          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">お店</label>
            <select id="purchaseShop" onchange="onPurchaseShopChange()" class="w-full text-sm border border-gray-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
            <input type="text" id="purchaseShopOther" placeholder="お店の名前" class="hidden mt-2 w-full text-sm border border-gray-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          </div>

          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">保管場所</label>
            <select id="purchaseStorage" class="w-full text-sm border border-gray-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="refrigerated">冷蔵</option>
              <option value="frozen">冷凍</option>
              <option value="roomTemp">常温</option>
            </select>
          </div>

          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">賞味期限（任意）</label>
            <input type="date" id="purchaseExpiry" class="w-full text-sm border border-gray-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm py-2.5 rounded-xl shadow transition-all">購入を記録する（在庫にも反映）</button>
        </form>
      </div>
    </div>

    <!-- バーコードスキャンモーダル -->
    <div id="scan-modal" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
      <div class="flex justify-between items-center px-4 py-3 bg-black/60 text-white">
        <span class="font-bold text-sm"><i class="fa-solid fa-barcode mr-1"></i> バーコードをスキャン</span>
        <button onclick="closeScanModal()" class="text-white hover:text-emerald-300"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div class="flex-1 flex items-center justify-center p-4">
        <div id="qr-reader" class="w-full max-w-sm"></div>
      </div>
      <p class="text-white/70 text-[11px] text-center pb-6 px-6">JANコードまたはインストアコード（20〜29で始まるコード）を枠内に収めてください。</p>
    </div>

    <script>
      // ---------- データ保持 ----------
      let allIngredients = [];
      let ingredientsById = {};
      let allRecipes = [];
      let allShops = [];
      let kotoroShoppingList = [];
      let kotoroStock = {};
      let kotoroCustomIngredients = {};
      let kotoroPurchaseHistory = {};
      let currentShopId = "";
      let html5QrCode = null;

      // ---------- localStorage 読み書き ----------
      function loadShoppingList() {
        try {
          kotoroShoppingList = JSON.parse(localStorage.getItem("kotoro_shopping_list")) || [];
        } catch (e) {
          kotoroShoppingList = [];
        }
      }
      function saveShoppingList() {
        localStorage.setItem("kotoro_shopping_list", JSON.stringify(kotoroShoppingList));
      }
      function loadStock() {
        try {
          kotoroStock = JSON.parse(localStorage.getItem("kotoro_stock")) || {};
        } catch (e) {
          kotoroStock = {};
        }
      }
      function saveStock() {
        localStorage.setItem("kotoro_stock", JSON.stringify(kotoroStock));
      }
      function loadCustomIngredients() {
        try {
          kotoroCustomIngredients = JSON.parse(localStorage.getItem("kotoro_custom_ingredients")) || {};
        } catch (e) {
          kotoroCustomIngredients = {};
        }
      }
      function saveCustomIngredients() {
        localStorage.setItem("kotoro_custom_ingredients", JSON.stringify(kotoroCustomIngredients));
      }
      function loadPurchaseHistory() {
        try {
          kotoroPurchaseHistory = JSON.parse(localStorage.getItem("kotoro_purchase_history")) || {};
        } catch (e) {
          kotoroPurchaseHistory = {};
        }
      }
      function savePurchaseHistory() {
        localStorage.setItem("kotoro_purchase_history", JSON.stringify(kotoroPurchaseHistory));
      }
      function loadCurrentShop() {
        currentShopId = localStorage.getItem("kotoro_current_shop") || "";
      }
      function saveCurrentShop(value) {
        currentShopId = value;
        localStorage.setItem("kotoro_current_shop", value);
      }

      // ---------- 初期化 ----------
      window.addEventListener("DOMContentLoaded", async () => {
        loadShoppingList();
        loadStock();
        loadCustomIngredients();
        loadPurchaseHistory();
        loadCurrentShop();

        try {
          const [ingRes, recRes, shopRes] = await Promise.all([fetch("ingredients.json"), fetch("recipes.json"), fetch("shop.json")]);
          if (!ingRes.ok) throw new Error("ingredients.jsonの読み込みに失敗しました");
          if (!recRes.ok) throw new Error("recipes.jsonの読み込みに失敗しました");
          if (!shopRes.ok) throw new Error("shop.jsonの読み込みに失敗しました");
          allIngredients = await ingRes.json();
          allRecipes = await recRes.json();
          allShops = await shopRes.json();

          ingredientsById = {};
          allIngredients.forEach((i) => (ingredientsById[i.ingredientId] = i));

          buildNameDatalist();
          buildShopSelect(document.getElementById("currentShopSelect"));
          buildShopSelect(document.getElementById("purchaseShop"));
          applyCurrentShopToTopBar();

          renderList();
        } catch (error) {
          console.error(error);
          document.getElementById("listContainer").innerHTML = `
            <div class="text-center py-8 text-red-500 text-xs">
              データの読み込みに失敗しました。<br>（ingredients.json・recipes.json・shop.jsonのパスをご確認ください）
            </div>
          `;
        }
      });

      function buildNameDatalist() {
        const list = document.getElementById("ingredientNameList");
        const names = new Set();
        allIngredients.forEach((i) => names.add(i.name));
        Object.values(kotoroCustomIngredients).forEach((c) => names.add(c.name));
        list.innerHTML = Array.from(names)
          .map((n) => `<option value="${n}"></option>`)
          .join("");
      }

      function buildShopSelect(selectEl) {
        let html = allShops.map((s) => `<option value="${s.shopId}">${s.name}</option>`).join("");
        html += `<option value="other">その他（自由入力）</option>`;
        selectEl.innerHTML = html;
      }

      function applyCurrentShopToTopBar() {
        const select = document.getElementById("currentShopSelect");
        const otherInput = document.getElementById("currentShopOther");
        const isKnownShop = allShops.some((s) => s.shopId === currentShopId);
        if (currentShopId && isKnownShop) {
          select.value = currentShopId;
          otherInput.classList.add("hidden");
        } else if (currentShopId) {
          // 自由入力で保存されたお店名の場合
          select.value = "other";
          otherInput.value = currentShopId;
          otherInput.classList.remove("hidden");
        }
      }

      function onShopSelectChange() {
        const select = document.getElementById("currentShopSelect");
        const otherInput = document.getElementById("currentShopOther");
        if (select.value === "other") {
          otherInput.classList.remove("hidden");
          otherInput.focus();
          saveCurrentShop(otherInput.value || "");
        } else {
          otherInput.classList.add("hidden");
          saveCurrentShop(select.value);
        }
      }

      function saveCurrentShopOther() {
        const otherInput = document.getElementById("currentShopOther");
        saveCurrentShop(otherInput.value || "");
      }

      function getShopName(shopIdOrName) {
        const found = allShops.find((s) => s.shopId === shopIdOrName);
        return found ? found.name : shopIdOrName || "不明なお店";
      }

      // ---------- 食材情報のヘルパー（stock.htmlと共通ロジック） ----------
      function getIngredientDisplay(ingredientId) {
        if (ingredientsById[ingredientId]) {
          const i = ingredientsById[ingredientId];
          return { name: i.name, category: i.category, isExempt: !!i.isExempt, isCustom: false };
        }
        if (kotoroCustomIngredients[ingredientId]) {
          const c = kotoroCustomIngredients[ingredientId];
          return { name: c.name, category: c.category || "その他", isExempt: false, isCustom: true };
        }
        return { name: ingredientId, category: "その他", isExempt: false, isCustom: true };
      }

      function getDefaultUnitForIngredient(ingredientId) {
        for (const r of allRecipes) {
          const found = (r.ingredients || []).find((i) => i.ingredientId === ingredientId);
          if (found) return found.unit;
        }
        return "個";
      }

      function categoryToDefaultStorage(category) {
        if (["肉類", "魚介類", "乳製品", "卵", "加工食品", "野菜"].includes(category)) return "refrigerated";
        if (["調味料", "穀類", "麺"].includes(category)) return "roomTemp";
        return "refrigerated";
      }

      function resolveIngredientIdByName(name) {
        const masterMatch = allIngredients.find((i) => i.name === name);
        if (masterMatch) return masterMatch.ingredientId;
        const customMatch = Object.entries(kotoroCustomIngredients).find(([, v]) => v.name === name);
        if (customMatch) return customMatch[0];
        return null;
      }

      // ---------- インストアコード（20〜29始まり） ----------
      function isInStoreCode(barcode) {
        if (!barcode || barcode.length < 2) return false;
        const prefix = parseInt(barcode.substring(0, 2), 10);
        return prefix >= 20 && prefix <= 29;
      }
      function generateInStoreCode() {
        const prefix = 20 + Math.floor(Math.random() * 10);
        const suffix = (Date.now() % 100000000000).toString().padStart(11, "0");
        return `${prefix}${suffix}`;
      }

      // ---------- バーコードから食材を特定 ----------
      function findMasterIngredientByBarcode(barcode) {
        for (const ing of allIngredients) {
          const products = Array.isArray(ing.product) ? ing.product : [ing.product];
          if (products.some((p) => p && p.barcode === barcode)) {
            return ing.ingredientId;
          }
        }
        return null;
      }
      function findCustomIngredientByBarcode(barcode) {
        const match = Object.entries(kotoroCustomIngredients).find(([, v]) => v.barcode === barcode);
        return match ? match[0] : null;
      }

      // ---------- ingredients.json未登録バーコードの記録（reset.htmlからエクスポートしてマージする用） ----------
      function recordPendingBarcodeLink(barcode, ingredientId, name) {
        if (!barcode) return;
        if (findMasterIngredientByBarcode(barcode)) return; // すでにingredients.jsonにあるバーコードは記録不要
        let pending = {};
        try {
          pending = JSON.parse(localStorage.getItem("kotoro_pending_barcode_links")) || {};
        } catch (e) {
          pending = {};
        }
        pending[barcode] = { ingredientId, name };
        localStorage.setItem("kotoro_pending_barcode_links", JSON.stringify(pending));
      }

      // ---------- 在庫データの追加／更新（stock.htmlと同じロジック） ----------
      function addToStock(ingredientId, payload) {
        const existing = kotoroStock[ingredientId];
        if (existing) {
          existing.quantity = parseFloat((existing.quantity + payload.quantity).toFixed(2));
          existing.unit = payload.unit;
          existing.storage = payload.storage;
          if (payload.expiryDate) existing.expiryDate = payload.expiryDate;
          existing.lastPrice = payload.price;
          existing.lastPurchaseDate = payload.purchaseDate;
          if (payload.barcode) existing.barcode = payload.barcode;
        } else {
          kotoroStock[ingredientId] = {
            quantity: payload.quantity,
            unit: payload.unit,
            storage: payload.storage,
            expiryDate: payload.expiryDate || null,
            lastPrice: payload.price,
            lastPurchaseDate: payload.purchaseDate,
            barcode: payload.barcode || null,
          };
        }
        saveStock();
      }

      // ---------- 購入履歴（直近5件）の追加と統計 ----------
      function addPurchaseRecord(ingredientId, record) {
        if (!kotoroPurchaseHistory[ingredientId]) kotoroPurchaseHistory[ingredientId] = [];
        kotoroPurchaseHistory[ingredientId].unshift(record); // 新しい順
        kotoroPurchaseHistory[ingredientId] = kotoroPurchaseHistory[ingredientId].slice(0, 5); // 直近5件のみ保持
        savePurchaseHistory();
      }

      // ingredients.json の product（配列の場合は複数規格）から、実際に購入したバーコードに
      // 一致する規格（amount・unit）を取得する。一致しない場合は先頭の規格にフォールバックする。
      function getProductVariant(ingredientId, barcode) {
        const info = ingredientsById[ingredientId];
        if (!info || !info.product) return null;
        const products = Array.isArray(info.product) ? info.product : [info.product];
        if (barcode) {
          const match = products.find((p) => p && p.barcode === barcode);
          if (match) return match;
        }
        return products[0] || null;
      }

      function computeStats(ingredientId) {
        const records = kotoroPurchaseHistory[ingredientId];
        if (!records || records.length === 0) return null;

        const unitPrices = records.map((r) => r.unitPrice);
        const totalPrices = records.map((r) => r.price);

        // 購入記録1件ごとに、そのとき実際に買ったバーコード（規格）に対応するamountで
        // パッケージ換算価格を計算する（同じ食材でも規格違いのバーコードが混在する場合に対応）
        const packagePrices = records.map((r) => {
          const variant = getProductVariant(ingredientId, r.barcode);
          const amount = variant && typeof variant.amount === "number" && variant.amount > 0 ? variant.amount : 1;
          return { price: r.unitPrice * amount, amount };
        });
        const cheapestPackage = packagePrices.reduce((min, p) => (p.price < min.price ? p : min), packagePrices[0]);

        const cheapestUnitPrice = Math.min(...unitPrices); // 単位（g・個など）あたりの単価ベース
        const avgTotalPrice = totalPrices.reduce((a, b) => a + b, 0) / totalPrices.length;
        const avgUnitPrice = unitPrices.reduce((a, b) => a + b, 0) / unitPrices.length;

        return {
          cheapestUnitPrice,
          cheapestPackagePrice: cheapestPackage.price,
          packageAmount: cheapestPackage.amount,
          avgTotalPrice,
          avgUnitPrice,
          unit: records[0].unit,
          count: records.length,
        };
      }

      // ---------- リストの描画 ----------
      function renderList() {
        const container = document.getElementById("listContainer");
        if (kotoroShoppingList.length === 0) {
          container.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs">買い物リストは空です。「＋ 追加」またはスキャンで登録できます。</div>`;
          return;
        }
        // 未購入を先に、購入済みは取り消し線表示で後ろに
        const sorted = [...kotoroShoppingList].sort((a, b) => Number(a.checked) - Number(b.checked));
        container.innerHTML = sorted.map((item) => buildListItemCard(item)).join("");
      }

      function buildListItemCard(item) {
        const info = getIngredientDisplay(item.ingredientId);
        const stats = computeStats(item.ingredientId);
        const stockEntry = kotoroStock[item.ingredientId];
        const badgeClass = info.isCustom ? "bg-amber-100 text-amber-800" : "bg-emerald-100 text-emerald-800";
        const badgeText = info.isCustom ? "手動 / インストア" : "共通食材";

        let statsHtml = "";
        if (stats) {
          const packageNote = stats.packageAmount > 1 ? `（${stats.packageAmount}${stats.unit}あたり）` : "";
          statsHtml = `
            <div class="text-[10px] text-gray-500 mt-1 flex flex-wrap gap-x-2 gap-y-0.5">
              <span class="text-emerald-700 font-bold">最安 ${Math.round(stats.cheapestPackagePrice)}円${packageNote}</span>
              <span>平均 ${Math.round(stats.avgTotalPrice)}円</span>
              <span>単価 ${stats.avgUnitPrice.toFixed(2)}円/${stats.unit}</span>
            </div>
          `;
        }

        const stockHtml = stockEntry ? `<span class="text-[10px] text-gray-400">在庫: ${stockEntry.quantity}${stockEntry.unit}</span>` : "";

        return `
          <div class="bg-white rounded-2xl shadow-sm border ${item.checked ? "border-gray-200 opacity-60" : "border-emerald-200"} p-3.5 transition-all">
            <div class="flex items-start gap-3">
              <input type="checkbox" ${item.checked ? "checked" : ""} onclick="toggleChecked('${item.ingredientId}')" class="mt-1 h-5 w-5 rounded border-gray-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer shrink-0" />
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="font-bold text-sm ${item.checked ? "line-through text-gray-400" : "text-gray-800"}">${info.name}</span>
                  <span class="${badgeClass} text-[10px] font-bold px-1.5 py-0.5 rounded-full">${badgeText}</span>
                </div>
                ${statsHtml}
                <div class="flex items-center justify-between mt-2">
                  ${stockHtml}
                  <button onclick="openPurchaseModal({ingredientId: '${item.ingredientId}'})" class="ml-auto bg-white text-emerald-700 hover:bg-emerald-600 hover:text-white border border-emerald-300 font-bold text-[11px] px-2.5 py-1 rounded-lg transition-all shadow-sm">購入登録</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function toggleChecked(ingredientId) {
        const item = kotoroShoppingList.find((i) => i.ingredientId === ingredientId);
        if (!item) return;
        item.checked = !item.checked;
        saveShoppingList();
        renderList();
      }

      // ---------- リストに追加モーダル ----------
      function openAddToListModal() {
        document.getElementById("listItemName").value = "";
        document.getElementById("listItemCategory").value = "";
        document.getElementById("add-list-modal").classList.remove("hidden");
      }
      function closeAddToListModal() {
        document.getElementById("add-list-modal").classList.add("hidden");
      }
      function submitAddToList(event) {
        event.preventDefault();
        const name = document.getElementById("listItemName").value.trim();
        const category = document.getElementById("listItemCategory").value;
        if (!name) return;

        let ingredientId = resolveIngredientIdByName(name);
        if (!ingredientId) {
          const barcode = generateInStoreCode();
          ingredientId = "local_" + barcode;
          kotoroCustomIngredients[ingredientId] = { name, category: category || "その他", barcode };
          saveCustomIngredients();
          buildNameDatalist();
        }

        if (!kotoroShoppingList.some((i) => i.ingredientId === ingredientId)) {
          kotoroShoppingList.push({ ingredientId, name, checked: false });
          saveShoppingList();
        }

        closeAddToListModal();
        renderList();
      }

      // ---------- 購入登録モーダル ----------
      function openPurchaseModal(options = {}) {
        const { ingredientId = null, barcode = "" } = options;
        const info = ingredientId ? getIngredientDisplay(ingredientId) : null;

        document.getElementById("purchaseResolvedId").value = ingredientId || "";
        document.getElementById("purchaseBarcode").value = barcode || "";
        document.getElementById("purchaseItemName").value = info ? info.name : "";
        document.getElementById("purchaseItemName").readOnly = !!ingredientId;
        document.getElementById("purchaseCategoryWrap").classList.toggle("hidden", !!ingredientId);
        document.getElementById("purchaseItemCategory").value = info ? info.category : "";
        document.getElementById("purchaseQuantity").value = 1;
        document.getElementById("purchaseUnit").value = ingredientId ? getDefaultUnitForIngredient(ingredientId) : "個";
        document.getElementById("purchasePrice").value = "";
        const existingStock = ingredientId ? kotoroStock[ingredientId] : null;
        document.getElementById("purchaseStorage").value = existingStock ? existingStock.storage : info ? categoryToDefaultStorage(info.category) : "refrigerated";
        document.getElementById("purchaseExpiry").value = "";

        // お店は現在選択中のお店を初期値にする
        const shopSelect = document.getElementById("purchaseShop");
        const shopOther = document.getElementById("purchaseShopOther");
        const isKnownShop = allShops.some((s) => s.shopId === currentShopId);
        if (currentShopId && isKnownShop) {
          shopSelect.value = currentShopId;
          shopOther.classList.add("hidden");
        } else if (currentShopId) {
          shopSelect.value = "other";
          shopOther.value = currentShopId;
          shopOther.classList.remove("hidden");
        } else {
          shopSelect.value = allShops[0] ? allShops[0].shopId : "other";
          shopOther.classList.add("hidden");
        }

        const hint = document.getElementById("purchaseModalHint");
        if (barcode && isInStoreCode(barcode) && !ingredientId) {
          hint.textContent = `インストアコード（${barcode}）：お店専用のバーコードです。食材名などを入力してください。`;
          hint.classList.remove("hidden");
        } else if (barcode && !ingredientId) {
          hint.textContent = `バーコード: ${barcode} — 新しい食材として登録されます。`;
          hint.classList.remove("hidden");
        } else {
          hint.classList.add("hidden");
        }

        document.getElementById("purchase-modal").classList.remove("hidden");
      }

      function closePurchaseModal() {
        document.getElementById("purchase-modal").classList.add("hidden");
      }

      function onPurchaseShopChange() {
        const select = document.getElementById("purchaseShop");
        const otherInput = document.getElementById("purchaseShopOther");
        otherInput.classList.toggle("hidden", select.value !== "other");
      }

      function submitPurchase(event) {
        event.preventDefault();

        const nameInput = document.getElementById("purchaseItemName").value.trim();
        const barcodeField = document.getElementById("purchaseBarcode").value.trim();
        const category = document.getElementById("purchaseItemCategory").value;
        const quantity = parseFloat(document.getElementById("purchaseQuantity").value);
        const unit = document.getElementById("purchaseUnit").value;
        const price = parseInt(document.getElementById("purchasePrice").value, 10);
        const storage = document.getElementById("purchaseStorage").value;
        const expiry = document.getElementById("purchaseExpiry").value || null;

        if (!nameInput || isNaN(quantity) || quantity <= 0 || isNaN(price) || price < 0) {
          alert("食材名・数量・金額を正しく入力してください。");
          return;
        }

        const shopSelect = document.getElementById("purchaseShop");
        const shopOther = document.getElementById("purchaseShopOther");
        let shopId = shopSelect.value;
        let shopName;
        if (shopId === "other") {
          shopName = shopOther.value.trim() || "不明なお店";
          shopId = shopName; // その場限りのお店名をIDとして扱う
        } else {
          shopName = getShopName(shopId);
        }
        saveCurrentShop(shopId);

        let ingredientId = document.getElementById("purchaseResolvedId").value || resolveIngredientIdByName(nameInput);
        let barcode = barcodeField || null;

        if (!ingredientId) {
          // バーコードが無い場合のみインストアコードを新規発行する。
          // 実際にスキャンされたJANコード等が渡された場合はそのまま保持し、
          // 次回同じ商品をスキャンした時にfindCustomIngredientByBarcode()で再認識できるようにする。
          if (!barcode) {
            barcode = generateInStoreCode();
          }
          ingredientId = "local_" + barcode;
          kotoroCustomIngredients[ingredientId] = { name: nameInput, category: category || "その他", barcode };
          saveCustomIngredients();
          buildNameDatalist();
        }

        // ingredients.json未登録のバーコードは、新規食材か既存食材への追加かに関わらず
        // 「ingredients.jsonへの反映待ち」として記録しておく（reset.htmlからエクスポート可能）
        recordPendingBarcodeLink(barcode, ingredientId, nameInput);

        const purchaseDate = formatDateISO(new Date());
        const unitPrice = parseFloat((price / quantity).toFixed(4));

        // 1. 購入履歴（直近5件）に追加
        addPurchaseRecord(ingredientId, { price, quantity, unit, unitPrice, shopId, shopName, date: purchaseDate, barcode });

        // 2. 在庫に反映
        addToStock(ingredientId, { quantity, unit, storage, expiryDate: expiry, price, purchaseDate, barcode });

        // 3. 買い物リスト上の対応アイテムがあればチェックを付ける
        const listItem = kotoroShoppingList.find((i) => i.ingredientId === ingredientId);
        if (listItem) {
          listItem.checked = true;
          saveShoppingList();
        }

        closePurchaseModal();
        renderList();
        alert(`「${nameInput}」の購入を記録しました！\n在庫にも反映しました。`);
      }

      function formatDateISO(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      // ---------- バーコードスキャン（html5-qrcode） ----------
      function openScanModal() {
        document.getElementById("scan-modal").classList.remove("hidden");
        html5QrCode = new Html5Qrcode("qr-reader");
        html5QrCode
          .start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            (decodedText) => onScanSuccess(decodedText),
            () => {
              /* 1フレームごとの読み取り失敗は無視 */
            }
          )
          .catch((err) => {
            alert("カメラを起動できませんでした。カメラの使用を許可してください。\n" + err);
            closeScanModal();
          });
      }

      function closeScanModal() {
        if (html5QrCode) {
          html5QrCode
            .stop()
            .then(() => html5QrCode.clear())
            .catch(() => {})
            .finally(() => {
              html5QrCode = null;
            });
        }
        document.getElementById("scan-modal").classList.add("hidden");
      }

      function onScanSuccess(decodedText) {
        closeScanModal();
        handleScannedBarcode(decodedText);
      }

      async function handleScannedBarcode(barcode) {
        // 1. 共通食材マスタ（ingredients.json）と突合
        let ingredientId = findMasterIngredientByBarcode(barcode);
        if (ingredientId) {
          openPurchaseModal({ ingredientId, barcode });
          return;
        }

        // 2. 過去に登録したカスタム食材（インストアコード等）と突合
        ingredientId = findCustomIngredientByBarcode(barcode);
        if (ingredientId) {
          openPurchaseModal({ ingredientId, barcode });
          return;
        }

        // 3. インストアコード（20〜29始まり）の場合は手動入力を案内
        if (isInStoreCode(barcode)) {
          openPurchaseModal({ barcode });
          return;
        }

        // 4. Open Food Facts API で商品情報を検索
        try {
          const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
          const data = await res.json();
          if (data && data.status === 1 && data.product) {
            const name = data.product.product_name_ja || data.product.product_name || "";
            openPurchaseModal({ barcode });
            document.getElementById("purchaseItemName").value = name;
            return;
          }
        } catch (e) {
          console.error("Open Food Facts APIの呼び出しに失敗しました", e);
        }

        // 5. 該当なし：手動入力にフォールバック
        openPurchaseModal({ barcode });
      }
    </script>
