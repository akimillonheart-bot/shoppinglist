<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>家の在庫・価格管理</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f5f7;--card:#fff;--text:#222;--muted:#70757d;--line:#e2e5e9;--accent:#2563eb;--danger:#dc2626;--ok:#15803d;--shadow:0 2px 10px #00000012}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
header{position:sticky;top:0;z-index:10;background:#ffffffee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head{max-width:1100px;margin:auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0}
.wrap{max-width:1100px;margin:auto;padding:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btn{padding:10px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:white;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}
.tile h3{margin:0 0 6px;font-size:17px}
.meta{color:var(--muted);font-size:13px;line-height:1.6}
.price{font-size:22px;font-weight:700;margin:10px 0 2px}
.low{color:var(--ok);font-weight:600}
.stock{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:36px;height:36px;border-radius:9px;background:#eef0f3;font-size:20px}
.qty{min-width:35px;text-align:center;font-weight:700}
.cat{font-size:12px;background:#eef2ff;color:#3730a3;padding:3px 7px;border-radius:999px;display:inline-block;margin-bottom:7px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100% - 24px));box-shadow:0 15px 60px #0005}
dialog::backdrop{background:#0008}
.modal{padding:20px}
.modal h2{margin:0 0 15px;font-size:19px}
.form{display:grid;gap:10px}
.form label{font-size:13px;color:var(--muted)}
.form input,.form select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.scanner{position:relative;background:#111;border-radius:12px;overflow:hidden;min-height:240px}
#video{width:100%;display:block;max-height:55vh;object-fit:cover}
.scanline{position:absolute;left:10%;right:10%;top:50%;height:2px;background:#fff;box-shadow:0 0 8px #fff}
.notice{padding:10px 12px;border-radius:9px;background:#f1f5f9;font-size:13px;margin-top:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:11px 15px;border-radius:999px;display:none;z-index:30}
@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.head{padding:12px}.btn{padding:10px 12px}}
</style>
</head>
<body>
<header><div class="head"><h1>🏠 在庫・価格管理</h1><button class="btn" id="settingsBtn">⚙ 設定</button></div></header>
<main class="wrap">
  <section class="tile" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div>
        <div class="meta">現在の調査店舗</div>
        <strong id="currentStoreLabel">店舗未選択</strong>
      </div>
      <button class="btn primary" id="selectStoreBtn">🏪 店を選ぶ</button>
    </div>
  </section>
  <div class="toolbar">
    <button class="btn primary" id="scanBtn">📷 バーコード</button>
    <button class="btn" id="addBtn">＋ 商品登録</button>
  </div>
  <input class="search" id="search" placeholder="商品名・バーコード・分類で検索">
  <div id="app"></div>
</main>


<dialog id="storeDialog">
  <div class="modal">
    <h2>調査するお店を選択</h2>
    <form class="form" id="storeForm">
      <label>店舗</label>
      <select id="storeSelect" required></select>
      <div class="actions">
        <button type="button" class="btn" id="cancelStore">キャンセル</button>
        <button class="btn primary">この店にする</button>
      </div>
    </form>
    <div class="notice">一度選択すると、価格調査を続けている間は店舗選択が維持されます。</div>
  </div>
</dialog>

<dialog id="scannerDialog">
  <div class="modal">
    <h2>バーコードを読み取る</h2>
    <div class="scanner"><video id="video" playsinline muted></video><div class="scanline"></div></div>
    <div class="notice" id="scanStatus">カメラを起動しています…</div>
    <div class="actions"><button class="btn" id="closeScanner">閉じる</button></div>
  </div>
</dialog>

<dialog id="productDialog">
  <div class="modal">
    <h2 id="productTitle">商品登録</h2>
    <form class="form" id="productForm">
      <input type="hidden" id="editId">
      <label>バーコード</label><input id="barcode" inputmode="numeric" placeholder="JANコード">
      <label>商品名</label><input id="name" required>
      <div class="row"><div><label>大分類</label><input id="major" placeholder="食料品"></div><div><label>中分類</label><input id="middle" placeholder="醤油"></div></div>
      <div class="row"><div><label>容量</label><input id="capacity" type="number" min="0" step="any"></div><div><label>単位</label><input id="capacityUnit" placeholder="ml"></div></div>
      <div class="row"><div><label>在庫数</label><input id="quantity" type="number" min="0" step="1" value="0"></div><div><label>在庫単位</label><input id="unit" placeholder="本"></div></div>
      <div class="row"><div><label>最安値</label><input id="lowestPrice" type="number" min="0" step="1"></div><div><label>最安値の日付</label><input id="lowestPriceDate" type="date"></div></div>
      <label>最安値のお店</label><select id="lowestPriceStore"></select>
      <div class="actions"><button type="button" class="btn" id="cancelProduct">キャンセル</button><button class="btn primary">保存</button></div>
    </form>
  </div>
</dialog>

<dialog id="priceDialog">
  <div class="modal">
    <h2>価格を入力</h2><div id="priceProduct" class="notice"></div>
    <form class="form" id="priceForm">
      <input type="hidden" id="priceId">
      <label>今回の価格（円）</label><input id="currentPrice" type="number" min="0" step="1" required inputmode="numeric">
      <label>お店</label><select id="currentStore" required></select>
      <div class="actions"><button type="button" class="btn" id="cancelPrice">キャンセル</button><button type="button" class="btn" id="saveAndScan">保存して次をスキャン</button><button class="btn primary">保存</button></div>
    </form>
  </div>
</dialog>


<dialog id="storeMasterDialog">
  <div class="modal">
    <h2>店舗マスター</h2>
    <div id="storeList"></div>
    <form class="form" id="storeAddForm" style="margin-top:14px">
      <label>新しい店舗</label>
      <input id="newStoreName" placeholder="例：スーパーA" required>
      <div class="actions">
        <button type="button" class="btn" id="closeStoreMaster">閉じる</button>
        <button class="btn primary">店舗を追加</button>
      </div>
    </form>
  </div>
</dialog>

<dialog id="settingsDialog">
  <div class="modal"><h2>データ管理</h2>
    <div class="toolbar">
      <button class="btn" id="manageStoresBtn">🏪 店舗マスター</button>
      <button class="btn" id="exportBtn">JSONを書き出す</button>
      <button class="btn" id="importBtn">JSONを読み込む</button>
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
      <button class="btn danger" id="clearBtn">全データ削除</button>
    </div>
    <div class="notice">データはこのブラウザのLocalStorageに保存されます。調査店舗は一度選ぶと維持され、価格登録時に自動的に使用されます。最安値は日付から365日を過ぎると自動的に削除されます。</div>
    <div class="actions"><button class="btn" id="closeSettings">閉じる</button></div>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const KEY="household_inventory_v1";
let data=loadData();
let selectedStoreId=localStorage.getItem("selected_store_id")||"";
let stream=null, detector=null, scanTimer=null;

function loadData(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    if(x && Array.isArray(x.products)){
      if(!Array.isArray(x.stores)) x.stores=[];
      return x;
    }
  }catch{}
  return {products:[],stores:[]}
}
function ensureStores(){
  if(!Array.isArray(data.stores)) data.stores=[];
}
function getSelectedStore(){
  ensureStores();
  return data.stores.find(s=>s.id===selectedStoreId)||null;
}
function renderStore(){
  ensureStores();
  const s=getSelectedStore();
  document.getElementById("currentStoreLabel").textContent=s?s.name:"店舗未選択";
}
function renderStoreSelect(){
  ensureStores();
  const sel=document.getElementById("storeSelect");
  sel.innerHTML=data.stores.length
    ? data.stores.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")
    : `<option value="">店舗マスターに店舗がありません</option>`;
  if(selectedStoreId && data.stores.some(s=>s.id===selectedStoreId)) sel.value=selectedStoreId;
}
function requireStore(){
  if(!getSelectedStore()){renderStoreSelect();storeDialog.showModal();return false}
  return true;
}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();renderStore()}
function cleanExpired(){
  const now=Date.now(); let changed=false;
  data.products.forEach(p=>{
    if(p.lowestPriceDate){
      const age=now-new Date(p.lowestPriceDate+"T00:00:00").getTime();
      if(age>=365*24*60*60*1000){
        p.lowestPrice=null;p.lowestPriceDate=null;p.lowestPriceStore=null;changed=true;
      }
    }
  });
  if(changed)localStorage.setItem(KEY,JSON.stringify(data));
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const list=data.products.filter(p=>[p.name,p.barcode,p.major,p.middle].some(x=>String(x??"").toLowerCase().includes(q)));
  document.getElementById("app").innerHTML=list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty">商品がありません。<br>「＋ 商品登録」または「📷 バーコード」から登録してください。</div>`;
}
function card(p){
  const low=p.lowestPrice==null?"未登録":`${p.lowestPrice.toLocaleString()}円`;
  return `<article class="tile">
    <span class="cat">${esc(p.major||"未分類")} / ${esc(p.middle||"")}</span>
    <h3>${esc(p.name)}</h3>
    <div class="meta">${p.capacity?esc(p.capacity)+" "+esc(p.capacityUnit||""):""}${p.barcode?`　JAN: ${esc(p.barcode)}`:""}</div>
    <div class="price">最安値：${low}</div>
    <div class="meta low">${p.lowestPriceDate?`${esc(p.lowestPriceStore||"店名なし")}　${esc(p.lowestPriceDate)}`:"直近1年間の記録なし"}</div>
    <div class="stock"><div>在庫：<b>${p.quantity??0}</b> ${esc(p.unit||"")}</div>
      <div class="step"><button onclick="changeQty('${p.id}',-1)">−</button><span class="qty">${p.quantity??0}</span><button onclick="changeQty('${p.id}',1)">＋</button></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="openPrice('${p.id}')">💴 価格</button>
      <button class="btn" onclick="editProduct('${p.id}')">編集</button>
      <button class="btn danger" onclick="deleteProduct('${p.id}')">削除</button>
    </div>
  </article>`
}
function changeQty(id,d){const p=data.products.find(x=>x.id===id);if(!p)return;p.quantity=Math.max(0,(p.quantity||0)+d);save()}
function renderPriceStoreSelect(defaultId){
  ensureStores();
  const sel=document.getElementById("currentStore");
  sel.innerHTML=data.stores.length
    ? data.stores.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")
    : '<option value="">店舗未登録</option>';
  if(defaultId && data.stores.some(s=>s.id===defaultId)) sel.value=defaultId;
}
function openPrice(id){
  if(!requireStore()) return;
  const p=data.products.find(x=>x.id===id);if(!p)return;
  const s=getSelectedStore();
  document.getElementById("priceId").value=id;
  document.getElementById("priceProduct").textContent=`${p.name}　／　${s.name}`;
  document.getElementById("currentPrice").value="";
  renderPriceStoreSelect(s.id);
  document.getElementById("priceDialog").showModal();
}
function renderLowestStoreSelect(selectedId){
  ensureStores();
  const sel=document.getElementById("lowestPriceStore");
  sel.innerHTML=data.stores.length
    ? data.stores.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")
    : '<option value="">店舗未登録</option>';
  if(selectedId && data.stores.some(s=>s.id===selectedId)) sel.value=selectedId;
}
function editProduct(id){
  const p=data.products.find(x=>x.id===id);if(!p)return;
  ["editId","barcode","name","major","middle","capacity","capacityUnit","quantity","unit","lowestPrice","lowestPriceDate"].forEach(k=>document.getElementById(k).value=p[k]??"");
  renderLowestStoreSelect(p.lowestPriceStoreId||"");
  if(!p.lowestPriceStoreId && p.lowestPriceStore){
    const oldStore=data.stores.find(s=>s.name===p.lowestPriceStore);
    if(oldStore) document.getElementById("lowestPriceStore").value=oldStore.id;
  }
  document.getElementById("productTitle").textContent="商品編集";document.getElementById("productDialog").showModal();
}
function deleteProduct(id){if(confirm("この商品を削除しますか？")){data.products=data.products.filter(p=>p.id!==id);save()}}
document.getElementById("addBtn").onclick=()=>{document.getElementById("productForm").reset();document.getElementById("editId").value="";document.getElementById("productTitle").textContent="商品登録";document.getElementById("productDialog").showModal()};
document.getElementById("cancelProduct").onclick=()=>document.getElementById("productDialog").close();
document.getElementById("productForm").onsubmit=e=>{
  e.preventDefault();
  const $=id=>document.getElementById(id);
  const id=$("editId").value||"P"+Date.now();
  const p={
    id,
    barcode:$("barcode").value.trim(),
    name:$("name").value.trim(),
    major:$("major").value.trim(),
    middle:$("middle").value.trim(),
    capacity:$("capacity").value?Number($("capacity").value):null,
    capacityUnit:$("capacityUnit").value.trim(),
    quantity:Number($("quantity").value||0),
    unit:$("unit").value.trim(),
    lowestPrice:$("lowestPrice").value?Number($("lowestPrice").value):null,
    lowestPriceDate:$("lowestPriceDate").value||null,
    lowestPriceStoreId:$("lowestPriceStore").value||null,
    lowestPriceStore:(()=>{const s=data.stores.find(s=>s.id===$("lowestPriceStore").value);return s?s.name:""})()
  };
  if(!p.name){alert("商品名を入力してください");$("name").focus();return}
  const i=data.products.findIndex(x=>x.id===id);
  if(i>=0)data.products[i]=p;else data.products.push(p);
  save();
  $("productDialog").close();
  if(i<0 && getSelectedStore()){
    toast("商品を登録しました。価格を入力してください");
    setTimeout(()=>openPrice(id),180);
  }else{
    toast("保存しました");
  }
}
document.getElementById("cancelPrice").onclick=()=>document.getElementById("priceDialog").close();
function saveCurrentPrice(){
  const p=data.products.find(x=>x.id===document.getElementById("priceId").value);if(!p)return false;
  const price=Number(document.getElementById("currentPrice").value),today=new Date().toISOString().slice(0,10);
  const storeId=document.getElementById("currentStore").value;
  const store=data.stores.find(s=>s.id===storeId);
  if(!store){document.getElementById("priceDialog").close();requireStore();return false}
  if(!Number.isFinite(price)||price<0){alert("価格を入力してください");document.getElementById("currentPrice").focus();return false}
  if(p.lowestPrice==null||price<p.lowestPrice||!p.lowestPriceDate){
    p.lowestPrice=price;p.lowestPriceDate=today;p.lowestPriceStoreId=store.id;p.lowestPriceStore=store.name;
    toast("最安値を更新しました");
  } else toast("価格を保存しました（最安値は変更なし）");
  save();return true;
}
document.getElementById("priceForm").onsubmit=e=>{
  e.preventDefault();
  if(saveCurrentPrice()) priceDialog.close();
};
document.getElementById("saveAndScan").onclick=async()=>{
  if(!saveCurrentPrice())return;
  document.getElementById("priceDialog").close();
  setTimeout(startScanner,150);
};
document.getElementById("search").oninput=render;
document.getElementById("settingsBtn").onclick=()=>settingsDialog.showModal();
document.getElementById("closeSettings").onclick=()=>settingsDialog.close();
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="inventory.json";a.click();URL.revokeObjectURL(a.href);toast("JSONを書き出しました")
};
document.getElementById("importBtn").onclick=()=>fileInput.click();
document.getElementById("fileInput").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.products)throw 0;data=x;save();toast("読み込みました")}catch{alert("正しいinventory.jsonではありません")}};r.readAsText(f);e.target.value=""
};
document.getElementById("clearBtn").onclick=()=>{if(confirm("すべての在庫データを削除しますか？")){data={products:[]};save();settingsDialog.close()}};

document.getElementById("selectStoreBtn").onclick=()=>{renderStoreSelect();storeDialog.showModal()};
document.getElementById("cancelStore").onclick=()=>storeDialog.close();
document.getElementById("storeForm").onsubmit=e=>{
  e.preventDefault();
  const id=storeSelect.value;
  if(!id){alert("店舗を選択してください");return}
  selectedStoreId=id;
  localStorage.setItem("selected_store_id",id);
  renderStore();storeDialog.close();toast("調査店舗を変更しました");
};
document.getElementById("manageStoresBtn").onclick=()=>{renderStoreList();storeMasterDialog.showModal()};
document.getElementById("closeStoreMaster").onclick=()=>storeMasterDialog.close();
function renderStoreList(){
  ensureStores();
  const el=document.getElementById("storeList");
  el.innerHTML=data.stores.length?data.stores.map(s=>`
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)">
      <span>${esc(s.name)}${s.id===selectedStoreId?'　✓使用中':''}</span>
      <button class="btn danger" onclick="deleteStore('${s.id}')">削除</button>
    </div>`).join(""):'<div class="empty">店舗がありません。</div>';
}
function deleteStore(id){
  const s=data.stores.find(x=>x.id===id);if(!s)return;
  if(!confirm(`「${s.name}」を店舗マスターから削除しますか？`))return;
  data.stores=data.stores.filter(x=>x.id!==id);
  if(selectedStoreId===id){selectedStoreId="";localStorage.removeItem("selected_store_id")}
  save();renderStoreList();renderStore();
}
document.getElementById("storeAddForm").onsubmit=e=>{
  e.preventDefault();
  const name=document.getElementById("newStoreName").value.trim();
  if(!name)return;
  ensureStores();
  if(data.stores.some(s=>s.name===name)){alert("同じ名前の店舗が既にあります");return}
  data.stores.push({id:"S"+Date.now(),name});
  save();document.getElementById("newStoreName").value="";renderStoreList();
  toast("店舗を追加しました");
};

async function startScanner(){
  if(!requireStore()) return;
  if(!("BarcodeDetector" in window)){alert("このブラウザではBarcodeDetectorが利用できません。Chrome系の最新ブラウザを推奨します。");return}
  scannerDialog.showModal();scanStatus.textContent="カメラを起動しています…";
  try{
    detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    video.srcObject=stream;await video.play();scanStatus.textContent="バーコードをカメラに映してください。";
    scanTimer=setInterval(async()=>{
      try{
        const codes=await detector.detect(video);
        if(codes.length){const code=codes[0].rawValue;stopScanner();await lookupBarcode(code)}
      }catch{}
    },300)
  }catch(e){scanStatus.textContent="カメラを利用できません。HTTPS接続とカメラ権限を確認してください。"}
}
function stopScanner(){if(scanTimer)clearInterval(scanTimer);scanTimer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;try{scannerDialog.close()}catch{}}
async function lookupBarcode(code){
  const existing=data.products.find(p=>p.barcode===code);
  if(existing){openPrice(existing.id);return}
  toast("Open Food Factsから商品情報を取得中…");
  try{
    const res=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json");
    const x=await res.json();
    if(x.status!==1||!x.product){document.getElementById("productForm").reset();barcode.value=code;document.getElementById("productTitle").textContent="商品登録（商品情報なし）";productDialog.showModal();return}
    const p=x.product;
    barcode.value=code;
    name.value=p.product_name_ja||p.product_name||"";
    major.value="";middle.value="";
    capacity.value=p.product_quantity_value||"";capacityUnit.value=p.product_quantity_unit||"";
    quantity.value=0;unit.value="個";lowestPrice.value="";lowestPriceDate.value="";lowestPriceStore.value="";
    document.getElementById("editId").value="";document.getElementById("productTitle").textContent="商品登録";
    productDialog.showModal();
  }catch{alert("Open Food Factsへの接続に失敗しました。")}
}
document.getElementById("scanBtn").onclick=startScanner;
document.getElementById("closeScanner").onclick=stopScanner;
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.style.display="block";clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display="none",2200)}
ensureStores();cleanExpired();render();renderStore();
</script>
